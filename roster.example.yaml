# Roster do Escritório — quem pode ser chamado por nome pelas suas sessões Claude Code.
#
# `brief` é a ÚNICA coisa devolvida pelo roster(): é assim que se descobre com quem
# falar sem carregar nenhum .md. Escreva pensando em "quando eu chamaria essa pessoa".
#
# tier:  advisor  = lê e aconselha, não escreve arquivo (padrão, e o certo pra quase tudo)
#        editor   = escreve no working tree, mas só sob claim() ativo
#        worktree = ganha git worktree próprio e entrega branch/diff
#
# Caminhos aceitam ~ e ${VAR}. ESCRITORIO_WORKSPACE é definido por máquina
# (Mac aponta pro SSD, VM aponta pro home) — é o que faz este arquivo servir nas duas.

